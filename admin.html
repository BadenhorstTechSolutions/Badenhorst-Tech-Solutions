<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | Badenhorst Tech Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body id="top">

   <nav>
        <img src="logo copy.png" id="adminTrigger" alt="Badenhorst Tech Solutions Logo" title="Badenhorst Tech Solutions Admin" style="height: 90px; width: auto; cursor: pointer;">
        
        <a href="https://wa.me/27732816192?text=Hi%20Ryno,%20I'm%20visiting%20your%20website%20and%20need%20some%20IT%20help." class="nav-btn-whatsapp">Message Me</a>
    </nav>

    <section class="admin-page-container">
        <div class="admin-modal-content">
            <a href="index.html" class="close-modal" style="text-decoration: none;">&times;</a>
            <div id="adminAuthStep">
                <h3 style="color: var(--accent-blue);">🔒 Admin Login</h3>
                <p style="margin: 10px 0; font-size: 0.9rem; opacity: 0.8;">Enter PIN to access controls:</p>
                <input type="password" id="adminPin" maxlength="4" placeholder="Enter PIN" style="padding: 10px; width: 100%; border-radius: 8px; border: 1px solid var(--accent-blue); background: rgba(255,255,255,0.1); color: white; text-align: center; font-size: 1.2rem; margin-bottom: 15px;">
                <button onclick="verifyPin()" class="nav-btn-whatsapp" style="width: 100%; border: none; cursor: pointer;">Unlock</button>
                <p id="pinError" style="color: #ff453a; font-size: 0.85rem; margin-top: 10px; display: none;">Incorrect PIN!</p>
            </div>
            
            <div id="adminControlsStep" style="display: none;">
                <h3 style="color: var(--accent-blue);">⚡ Admin Console</h3>
                <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">Manual Override Settings:</p>
                <div style="margin: 20px 0; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                    <span>Close Early / Busy</span>
                    <label class="switch">
                        <input type="checkbox" id="closeEarlyToggle" onchange="toggleClosedEarly()">
                        <span class="slider round"></span>
                    </label>
                </div>
                <a href="index.html" class="nav-btn-whatsapp" style="display: block; text-align: center; margin-top: 20px;">Return Home</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
